name: "OXID Plugin Test"
description: "Runs OXID plugin tests"

inputs:
  php_version:
    description: "PHP version used in this run"
    required: true

  syntax_check_paths:
    description: "Paths for PHP syntax check (comma separated). If empty, syntax check is skipped."
    required: false

  oxid_ref:
    description: "OXID version / ref used"
    required: true

  sourceguardian:
    description: "Whether SourceGuardian is required"
    required: false
    default: "false"

  composer_package_name:
    description: "Composer package name or JSON array of requirements (e.g. d3/mypackage or [\"d3/a\", \"d3/b\"])"
    required: true

  plugin_package_name:
    description: "Optional explicit plugin package name used for test config detection (e.g. d3/mypackage)"
    required: false

  oxid_module_ids:
    description: "Comma-separated list of OXID module IDs (e.g. d3mypackage) to activate, order matters. If empty, module activation is skipped."
    required: false

  module_licenses:
    description: "JSON map of module IDs to license keys"
    required: false

  test_suites:
    description: "Comma separated list of test suites (e.g. unit,integration). If empty, run all tests."
    required: false

  debug:
    required: false
    default: "false"

  git_access_token:
    description: "Access token for private repositories"
    required: false

  fail_on_module_activation_error:
    description: "Fail pipeline on module activation error"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:

    - name: Dump received inputs (debug)
      shell: bash
      run: |
        echo "PHP version:        ${{ inputs.php_version }}"
        echo "OXID ref:           ${{ inputs.oxid_ref }}"
        echo "SourceGuardian:     ${{ inputs.sourceguardian }}"
        echo "Composer package:   ${{ inputs.composer_package_name }}"
        echo "Plugin package:     ${{ inputs.plugin_package_name }}"
        echo "Module IDs:         ${{ inputs.oxid_module_ids }}"
        echo "Test suites:        ${{ inputs.test_suites }}"

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php_version }}
        tools: composer:v2
        extensions: mbstring, intl, gd, mysql, zip, curl
        coverage: none
        ini-values: |
          memory_limit=1G
          date.timezone=Europe/Berlin

    - name: Show PHP & Composer versions
      shell: bash
      run: |
        php -v
        composer --version

    - name: Install SourceGuardian Loader
      if: inputs.sourceguardian == 'true'
      shell: bash
      run: |
        echo "Installing SourceGuardian loader"

        PHP_VERSION=$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')
        LOADER="ixed.${PHP_VERSION}.lin"

        curl -fsSL https://www.sourceguardian.com/loaders/download/loaders.linux-x86_64.tar.gz -o sg.tar.gz
        mkdir -p loaders ~/.php-ext
        tar -xzf sg.tar.gz -C loaders

        if [[ ! -f "loaders/${LOADER}" ]]; then
          echo "ERROR: SourceGuardian loader ${LOADER} not found in archive"
          exit 1
        fi

        cp "loaders/${LOADER}" "$HOME/.php-ext/"

    - name: Enable and verify SourceGuardian Loader
      if: inputs.sourceguardian == 'true'
      shell: bash
      run: |
        echo "Enable and verify SourceGuardian Loader"
        
        echo "zend_extension=$HOME/.php-ext/ixed.$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;').lin" \
          > $HOME/sourceguardian.ini
        echo "sourceguardian.enable=1" >> $HOME/sourceguardian.ini

        PHP_INI_DIR=$(php -i | grep '^Scan this dir for additional .ini files =>' | sed 's/.*=> //')
        sudo cp $HOME/sourceguardian.ini "$PHP_INI_DIR/99-sourceguardian.ini"

        echo "Verifying SourceGuardian installation"
        php --ini
        php -m | grep -i sourceguardian || {
          echo "ERROR: SourceGuardian was requested but is not active"
          exit 1
        }

    - name: PHP syntax check
      shell: bash
      run: |
        echo "PHP syntax check"
        
        if [[ -z "${{ inputs.syntax_check_paths }}" ]]; then
          echo "No syntax check paths provided – skipping PHP syntax check."
          exit 0
        else
          echo "Running PHP syntax check"

          IFS=',' read -ra PATHS <<< "${{ inputs.syntax_check_paths }}"

          for RAW_PATH in "${PATHS[@]}"; do
            PATH_TRIMMED="$(echo "$RAW_PATH" | xargs)"

            if [[ -z "$PATH_TRIMMED" ]]; then
              echo "Empty path entry - skipped."
              continue
            fi

            if [[ -d "$PATH_TRIMMED" ]]; then
              echo "Checking PHP files in $PATH_TRIMMED"
              find "$PATH_TRIMMED" -name "*.php" -print0 | xargs -0 -n1 php -l
            else
              echo "Path '$PATH_TRIMMED' does not exist - skipped."
            fi
          done
        fi

    - name: Install YAML linter
      shell: bash
      run: |
        echo "Install YAML linter"
        
        pip install yamllint

    - name: Create yamllint config
      shell: bash
      run: |
        echo "Create yamllint config"
        
        cat > /tmp/.yamllint <<'EOF'
        extends: default

        rules:
          document-start: disable
          truthy: disable
          indentation: disable
        
          line-length:
            max: 200
            level: warning

          braces:
            min-spaces-inside: 1
            max-spaces-inside: 1

        ignore: |
          vendor/
          shop/
        EOF

    - name: Debug working directory
      shell: bash
      run: |
        echo "Debug working directory"
        
        pwd
        ls -la
        find . -name ".yamllint"

    - name: Lint module YAML files
      shell: bash
      run: |
        echo "Lint module YAML files"
        
        find . \
          \( -name "*.yml" -o -name "*.yaml" \) \
          -not -path "./vendor/*" \
          -not -path "./shop/*" \
          -not -path "./.ci-actions/*" \
          -exec yamllint -c /tmp/.yamllint {} +

    - name: Detect non UTF-8 YAML files
      shell: bash
      run: |
        echo "Detect non UTF-8 YAML files"
        
        find . \
          \( -name "*.yml" -o -name "*.yaml" \) \
          -not -path "./vendor/*" \
          -exec file -i {} \;

    - name: Install OXID Shop
      shell: bash
      run: |
        echo "Creating OXID shop project"
        
        composer create-project oxid-esales/oxideshop-project shop "${{ inputs.oxid_ref }}" \
          --no-interaction --no-security-blocking

    - name: Configure Composer plugins and security settings
      shell: bash
      working-directory: shop
      run: |
        echo "Configuring Composer plugin permissions"
        
        composer config allow-plugins true
        composer config audit.block-insecure false

    - name: Run OXID setup
      shell: bash
      working-directory: shop
      run: |
        echo "Running OXID shop setup"

        : "${DB_HOST:?DB_HOST not set}"
        : "${DB_NAME:?DB_NAME not set}"
        : "${DB_USER:?DB_USER not set}"
        : "${DB_PASS:?DB_PASS not set}"

        vendor/bin/oe-console oe:setup:shop \
          --db-host="$DB_HOST" \
          --db-name="$DB_NAME" \
          --db-user="$DB_USER" \
          --db-password="$DB_PASS" \
          --db-port="${DB_PORT:-3306}" \
          --shop-url="http://localhost" \
          --shop-directory="$(pwd)/source" \
          --compile-directory="$(pwd)/source/tmp" \
          --language=de

    - name: Create OXID admin user
      shell: bash
      working-directory: shop
      run: |
        echo "Creating OXID admin user"
        
        vendor/bin/oe-console oe:admin:create-user \
          --admin-email=ci@example.dev \
          --admin-password=admina

    - name: Activate OXID theme (if supported)
      shell: bash
      working-directory: shop
      run: |
        echo "Attempting theme activation"

        if vendor/bin/oe-console list | grep -q "oe:theme:activate"; then
          vendor/bin/oe-console oe:theme:activate apex
        else
          echo "Theme activation not supported in this OXID version - skipped."
        fi

    - name: Configure Composer auth for 3rd party repos
      shell: bash
      working-directory: shop
      run: |
        echo "Configure Composer auth for 3rd party repos"
        
        if [[ -z "${{ inputs.git_access_token }}" ]]; then
          echo "No git access token provided - skipping Composer auth setup."
          exit 0
        fi

        composer config --global http-basic.git.d3data.de \
          gitea-admin \
          "${{ inputs.git_access_token }}"

    - name: Register CI composer repositories
      shell: bash
      working-directory: shop
      run: |
        echo "Register CI composer repositories"

        REPO_FILE="../.github/composer-repositories.json"

        if [[ ! -f "$REPO_FILE" ]]; then
          echo "No composer repository manifest found - skipping."
          exit 0
        fi

        if ! jq -e '.repositories | type == "array"' "$REPO_FILE" > /dev/null; then
          echo "Invalid composer repository manifest - expected .repositories array"
          exit 1
        fi

        if [[ "$(jq '.repositories | length' "$REPO_FILE")" -eq 0 ]]; then
          echo "Composer repository manifest is empty - skipping."
          exit 0
        fi

        jq -r '.repositories[] | @base64' "$REPO_FILE" | while read -r REPOSITORY; do
          NAME="$(echo "$REPOSITORY" | base64 --decode | jq -r '.name // empty')"
          TYPE="$(echo "$REPOSITORY" | base64 --decode | jq -r '.type // "vcs"')"
          URL="$(echo "$REPOSITORY" | base64 --decode | jq -r '.url // empty')"

          if [[ -z "$NAME" || -z "$URL" ]]; then
            echo "Skipping invalid repository entry - name or url missing."
            continue
          fi

          echo "Registering composer repository: $NAME ($TYPE)"
          composer config "repositories.${NAME}" "$TYPE" "$URL"
        done

    - name: Register ModCfg repository
      shell: bash
      working-directory: shop
      run: |
        echo "Register ModCfg repository"
        
        if jq -e '.require["d3/modcfg"]' ../composer.json > /dev/null; then
          echo "modcfg required - registering repository"

          composer config repositories.d3modcfg vcs \
            https://git.d3data.de/D3Private/ModCfg.git
        fi

    - name: Register plugin repository (path)
      shell: bash
      working-directory: shop
      run: |
        echo "Registering plugin path repository"
        
        composer config repositories.plugin path ../

    - name: Patch OXID exception swallowing
      shell: bash
      working-directory: shop
      run: |
        echo "Patching OXID exception swallowing"
  
        FILE="vendor/oxid-esales/oxideshop-ce/source/Internal/Framework/Module/Setup/Validator/ServicesYamlValidator.php"

        sed -i '/throw new InvalidModuleServicesException(/,/);/c\            print_r(debug_backtrace(DEBUG_BACKTRACE_IGNORE_ARGS)); print_r(\$e); throw \$e;' "$FILE"

    - name: Install plugin via Composer
      shell: bash
      working-directory: shop
      run: |
        echo "Installing plugin via Composer"

        REQUIREMENTS_INPUT='${{ inputs.composer_package_name }}'
        REQUIRE_ARGS=()

        if [[ "$REQUIREMENTS_INPUT" == \[* ]]; then
          if ! jq -e 'type == "array"' <<< "$REQUIREMENTS_INPUT" > /dev/null; then
            echo "composer_package_name starts with '[' but is not valid JSON array"
            exit 1
          fi

          while IFS= read -r PACKAGE; do
            PACKAGE_TRIMMED="$(echo "$PACKAGE" | xargs)"

            if [[ -z "$PACKAGE_TRIMMED" ]]; then
              continue
            fi

            if [[ "$PACKAGE_TRIMMED" == *:* ]]; then
              REQUIRE_ARGS+=("$PACKAGE_TRIMMED")
            else
              REQUIRE_ARGS+=("${PACKAGE_TRIMMED}:@dev")
            fi
          done < <(jq -r '.[]' <<< "$REQUIREMENTS_INPUT")
        else
          PACKAGE_TRIMMED="$(echo "$REQUIREMENTS_INPUT" | xargs)"

          if [[ -z "$PACKAGE_TRIMMED" ]]; then
            echo "No composer package name provided"
            exit 1
          fi

          if [[ "$PACKAGE_TRIMMED" == *:* ]]; then
            REQUIRE_ARGS+=("$PACKAGE_TRIMMED")
          else
            REQUIRE_ARGS+=("${PACKAGE_TRIMMED}:@dev")
          fi
        fi

        if [[ "${#REQUIRE_ARGS[@]}" -eq 0 ]]; then
          echo "No valid composer package requirements found"
          exit 1
        fi

        composer require "${REQUIRE_ARGS[@]}" \
          --prefer-source --no-interaction --no-progress

    - name: Install plugin dev dependencies
      shell: bash
      working-directory: shop
      run: |
        echo "Install plugin dev dependencies"
        
        DEV_DEPS=$(jq -r '.["require-dev"] | to_entries | map("\(.key):\(.value)") | join(" ")' ../composer.json)

        if [ -n "$DEV_DEPS" ]; then
          composer require --dev --prefer-lowest $DEV_DEPS --no-interaction --no-progress
        else
          echo "No require-dev dependencies provided"
        fi

    - name: Bootstrap oe-console
      shell: bash
      working-directory: shop
      run: |
        vendor/bin/oe-console list

    - name: Activate OXID modules
      shell: bash
      working-directory: shop
      run: |
        echo "Starting module activation"

        if [[ -z "${{ inputs.oxid_module_ids }}" ]]; then
          echo "No OXID module IDs provided - skipping module activation."
        else
          IFS=',' read -ra MODULES <<< "${{ inputs.oxid_module_ids }}"

          for MODULE in "${MODULES[@]}"; do
            MODULE_TRIMMED="$(echo "$MODULE" | xargs)"

            if [[ -z "$MODULE_TRIMMED" ]]; then
              echo "Empty module ID encountered - skipped."
              continue
            fi

            echo "Activating module: $MODULE_TRIMMED"

            if ! vendor/bin/oe-console oe:module:activate "$MODULE_TRIMMED"; then
              echo "ERROR: Module activation failed for '$MODULE_TRIMMED'"

              if [[ "${{ inputs.fail_on_module_activation_error }}" == "true" ]]; then
                exit 1
              fi
            fi
          done
        fi

    - name: Clear temporary directory
      shell: bash
      working-directory: shop
      run: |
        echo "Clearing temporary directory"
        
        rm -rf ./source/tmp/* || true
        ls -la ./source/tmp || true

    - name: Run optional module install script
      shell: bash
      working-directory: shop
      run: |
        echo "Checking for optional module install script"

        SCRIPT="vendor/bin/d3modules_install"

        QUIET_FLAG=""
        if [[ "${{ inputs.debug }}" != "true" ]]; then
          QUIET_FLAG="--quiet"
        fi

        if [[ ! -e "$SCRIPT" ]]; then
          echo "No install script found - skipping."
        elif [[ ! -x "$SCRIPT" ]]; then
          echo "Install script exists but is not executable:"
          echo "  $SCRIPT"
          echo "Skipping execution."
          exit 1
        else
          echo "Running install script: $SCRIPT $QUIET_FLAG"
          "$SCRIPT" || echo "WARNING: Install script failed - continuing."
        fi

    - name: Set module licenses
      shell: bash
      working-directory: shop
      run: |
        echo "Starting module license setup"

        if [[ -z "${{ inputs.module_licenses }}" ]]; then
          echo "No module licenses provided - skipping."
        elif ! vendor/bin/oe-console list | grep -q 'd3:modcfg:license:set'; then
          echo "License command not available - skipping."
          exit 1
        else
          echo '${{ inputs.module_licenses }}' \
            | jq -r 'to_entries[] | "\(.key) \(.value)"' \
            | while read -r MODULE_ID LICENSE_KEY; do
                if [[ -z "$LICENSE_KEY" ]]; then
                  echo "No license key for module $MODULE_ID - skipped."
                  continue
                fi

                echo "Setting license for module $MODULE_ID"

                vendor/bin/oe-console d3:modcfg:license:set 1 "$MODULE_ID" "$LICENSE_KEY" \
                  || echo "WARNING: License activation failed for $MODULE_ID - continuing."
              done
        fi
    - name: Detect test configuration files
      id: detect_test_configs
      shell: bash
      working-directory: shop
      run: |
        echo "Detecting module test configuration files"

        PLUGIN_PACKAGE=""
        EXPLICIT_PLUGIN_PACKAGE='${{ inputs.plugin_package_name }}'

        if [[ -n "$EXPLICIT_PLUGIN_PACKAGE" ]]; then
          PLUGIN_PACKAGE="$(echo "$EXPLICIT_PLUGIN_PACKAGE" | xargs)"
          PLUGIN_PACKAGE="${PLUGIN_PACKAGE%%:*}"
        else
          REQUIREMENTS_INPUT='${{ inputs.composer_package_name }}'

          if [[ "$REQUIREMENTS_INPUT" == \[* ]]; then
            if ! jq -e 'type == "array"' <<< "$REQUIREMENTS_INPUT" > /dev/null; then
              echo "composer_package_name starts with '[' but is not valid JSON array"
              exit 1
            fi

            while IFS= read -r PACKAGE; do
              PACKAGE_TRIMMED="$(echo "$PACKAGE" | xargs)"

              if [[ -z "$PACKAGE_TRIMMED" ]]; then
                continue
              fi

              PLUGIN_PACKAGE="${PACKAGE_TRIMMED%%:*}"
            done < <(jq -r '.[]' <<< "$REQUIREMENTS_INPUT")
          else
            PACKAGE_TRIMMED="$(echo "$REQUIREMENTS_INPUT" | xargs)"

            if [[ -z "$PACKAGE_TRIMMED" ]]; then
              echo "No composer package name provided"
              exit 1
            fi

            PLUGIN_PACKAGE="${PACKAGE_TRIMMED%%:*}"
          fi
        fi

        if [[ -z "$PLUGIN_PACKAGE" ]]; then
          echo "No valid composer package name resolved"
          exit 1
        fi

        PLUGIN_DIR="vendor/${PLUGIN_PACKAGE}"

        find_phpstan_config() {
          local plugin_dir="$1"
          local candidate

          for candidate in \
            "$plugin_dir/phpstan.neon" \
            "$plugin_dir/phpstan.neon.dist" \
            "$plugin_dir/.ci-tools/phpstan.neon" \
            "$plugin_dir/.ci-tools/phpstan.neon.dist"; do
            if [[ -f "$candidate" ]]; then
              echo "$candidate"
              return 0
            fi
          done

          find "$plugin_dir" \
            \( -path "$plugin_dir/vendor" -o -path "$plugin_dir/.git" -o -path "$plugin_dir/node_modules" \) -prune -o \
            -type f \( -name "phpstan.neon" -o -name "phpstan.neon.dist" \) -print -quit
        }

        find_phpunit_config() {
          local plugin_dir="$1"
          local candidate

          for candidate in \
            "$plugin_dir/phpunit.xml" \
            "$plugin_dir/phpunit.xml.dist" \
            "$plugin_dir/.ci-tools/phpunit.xml" \
            "$plugin_dir/.ci-tools/phpunit.xml.dist"; do
            if [[ -f "$candidate" ]]; then
              echo "$candidate"
              return 0
            fi
          done

          find "$plugin_dir" \
            \( -path "$plugin_dir/vendor" -o -path "$plugin_dir/.git" -o -path "$plugin_dir/node_modules" \) -prune -o \
            -type f \( -name "phpunit.xml" -o -name "phpunit.xml.dist" \) -print -quit
        }

        PHPSTAN_CONFIG="$(find_phpstan_config "$PLUGIN_DIR")"
        PHPUNIT_CONFIG="$(find_phpunit_config "$PLUGIN_DIR")"

        echo "phpstan_config=$PHPSTAN_CONFIG" >> "$GITHUB_OUTPUT"
        echo "phpunit_config=$PHPUNIT_CONFIG" >> "$GITHUB_OUTPUT"

    - name: Run PHPStan
      shell: bash
      working-directory: shop
      if: ${{ steps.detect_test_configs.outputs.phpstan_config != '' }}
      run: |
        echo "Running PHPStan"
        
        set +o pipefail

        CONFIG="${{ steps.detect_test_configs.outputs.phpstan_config }}"

        if [ "${{ inputs.debug }}" = "true" ] || [ "${{ inputs.debug }}" = "1" ]; then
          OUTPUT_FILE=phpstan.log
          vendor/bin/phpstan analyse \
            --configuration="$CONFIG" \
            --no-progress \
            --error-format=raw \
            >"$OUTPUT_FILE" 2>&1 || PHPSTAN_EXIT=$?
          echo "---- PHPStan output ----"
          cat "$OUTPUT_FILE"
        else
          vendor/bin/phpstan analyse \
            --configuration="$CONFIG" \
            --no-progress \
            --quiet \
            2>&1 || PHPSTAN_EXIT=$?
        fi

        exit ${PHPSTAN_EXIT:-0}

    - name: Run PHPUnit tests
      shell: bash
      working-directory: shop
      if: ${{ steps.detect_test_configs.outputs.phpunit_config != '' }}
      run: |
        echo "Running PHPUnit tests"

        CONFIG="${{ steps.detect_test_configs.outputs.phpunit_config }}"

        if [[ -z "${{ inputs.test_suites }}" ]]; then
          php \
            -d error_reporting="E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED" \
            -d display_errors=Off \
            vendor/bin/phpunit \
              --fail-on-risky \
              --fail-on-warning \
              --configuration="$CONFIG" \
              --no-coverage \
              --bootstrap="source/bootstrap.php"
        else
          IFS=',' read -ra SUITES <<< "${{ inputs.test_suites }}"

          for SUITE in "${SUITES[@]}"; do
            SUITE="$(echo "$SUITE" | xargs)"
            echo "Running test suite: $SUITE"

            php \
              -d error_reporting="E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED" \
              -d display_errors=Off \
              vendor/bin/phpunit \
                --fail-on-risky \
                --fail-on-warning \
                --configuration="$CONFIG" \
                --no-coverage \
                --bootstrap="source/bootstrap.php" \
                --testsuite="$SUITE"
          done
        fi

    - name: Dump OXID logs on failure
      shell: bash
      working-directory: shop
      if: failure()
      run: |
        echo "==== OXID LOGS ===="

        find source/log -type f -exec sh -c '
          echo "---- $1 ----"
          cat "$1"
        ' _ {} \; || true

        echo "==== TMP LOGS ===="

        find source/tmp -type f | head -50 || true
